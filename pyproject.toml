[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-nim-rag-sentiment-alpha"
version = "1.0.0"
description = "SEC Filing RAG & Quantitative Sentiment Analyzer powered by NVIDIA NIM"
authors = [{name = "hrczggyrgy"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edgartools>=5.60.0",
    "yfinance>=0.2.50",
    "langchain>=0.3.15",
    "langchain-core>=0.3.30",
    "langchain-community>=0.3.15",
    "langchain-text-splitters>=0.3.5",
    "langchain-nvidia-ai-endpoints>=1.4.0",
    "chromadb>=0.6.0",
    "transformers>=4.46.0",
    "torch>=2.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.24.0",
    "streamlit>=1.41.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sec_nim_alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "unit",
    "integration",
    "live",
    "slow",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20", "TID"]
ignore = ["ANN101", "ANN102", "T201", "T203"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true